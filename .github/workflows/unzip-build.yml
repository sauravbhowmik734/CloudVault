name: Unzip and Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo root
        run: |
          unzip -q CloudVault.zip -d /tmp/x
          cp -r /tmp/x/CloudVault/. ./
          rm -rf .github/workflows/build.yml
          git rm -q CloudVault.zip

      - name: Commit source files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A -- . ':!.github'
          git commit -m "Extract CloudVault source" || true
          git push || true

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CloudVault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
